<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Cena</title>
    <!-- three.js, gsap e as fontes vêm de vendor/ (o render funciona sem internet); uma fonte que não está lá vem do Google -->
    <link rel="stylesheet" href="vendor/fonts/fonts.css" />
    {{FONT_LINK}}
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
    <link rel="stylesheet" href="js/motor/textos.css" />
  </head>
  <body>
    <!-- escrito pelo montar.py. Contrato do HyperFrames: a composição "main", o canvas como clip, a voz como faixa,
         uma timeline gsap do tamanho do vídeo e a cena redesenhada a cada hf-seek -->
    <div id="video" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      <canvas id="tela" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0"></canvas>
      {{AUDIO}}
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true }).set({}, {}, {{DURATION}});
    </script>
    <script type="module">
      import { createScene } from "./js/cena.js";
      let draw = null;
      let now = window.__hfThreeTime || 0;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["cena"] = (async () => {
        await document.fonts.ready;
        draw = createScene(document.getElementById("tela"), document.getElementById("video"));
        draw(window.__hfThreeTime ?? now);
      })();
      window.addEventListener("hf-seek", (event) => {
        now = event.detail.time;
        if (draw) draw(now);
      });
    </script>
  </body>
</html>
